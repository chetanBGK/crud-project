apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # nodeName: ip-172-31-12-84
      imagePullSecrets:
        - name: ecr-secret
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-42-240
      containers:
      - name: frontend
        image: 819168518875.dkr.ecr.ap-south-1.amazonaws.com/crud-frontend:16
        env:
        - name: REACT_APP_BACKEND_URL
          value: "http://backend:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: frontend