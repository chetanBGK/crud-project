apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ecr-secret
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-42-240
      containers:
      - name: backend
        image: 819168518875.dkr.ecr.ap-south-1.amazonaws.com/crud-backend:16
        env:
        - name: DB_HOST
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "crud"
        - name: DB_USER
          value: "mysql"
        - name: DB_PASSWORD
          value: "mysql"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: backend